<!doctype html><html><head><meta charset="utf-8"><title>mock whatnot</title>
<!-- Test page for scripts/recog-check.js: a Whatnot-like layout with a live <video> (canvas stream) and a stubbed
     chrome.* so the extension's recognition scripts run outside Chrome. ?mode=video | tainted | novideo -->
<style>body{margin:0;background:#111;color:#ddd;font:14px sans-serif}#v{position:absolute;left:100px;top:20px;width:540px;height:760px;object-fit:cover;background:#000}
#chat{position:absolute;left:700px;top:20px;width:520px;height:760px;background:#1b1b1b;padding:10px;box-sizing:border-box}</style></head><body>
<div id="chat">rewired: Zapdos please sir<br>jpdaddy12: $11 blue light special</div>
<script>
const mode = new URLSearchParams(location.search).get("mode") || "video";
window.__sent = []; window.__listeners = []; window.__runtime = []; window.__store = {}; window.__storeWatch = [];
Object.defineProperty(window, "chrome", { configurable: true, writable: true, value: {
  runtime: { onMessage: { addListener: (fn) => window.__listeners.push(fn) }, onInstalled: { addListener: () => {} }, lastError: null,
    sendMessage: (msg, cb) => { window.__runtime.push(msg); const sender = { tab: { id: 1, windowId: 1, url: location.href } };
      let out; for (const fn of window.__listeners) fn(msg, sender, (r) => { out = r; }); if (typeof cb === "function") setTimeout(() => cb(out), 0); return Promise.resolve(out); } },
  storage: { local: {
      get: (keys, cb) => { const o = {}; [].concat(keys).forEach((k) => { if (k in window.__store) o[k] = window.__store[k]; }); setTimeout(() => cb(o), 0); },
      set: (obj, cb) => { const ch = {}; for (const k in obj) { ch[k] = { newValue: obj[k] }; window.__store[k] = obj[k]; } window.__storeWatch.forEach((f) => f(ch, "local")); if (cb) setTimeout(cb, 0); },
      remove: (keys, cb) => { [].concat(keys).forEach((k) => delete window.__store[k]); if (cb) setTimeout(cb, 0); } },
    onChanged: { addListener: (f) => window.__storeWatch.push(f) } },
  commands: { onCommand: { addListener: () => {} } },
  contextMenus: { create: () => {}, onClicked: { addListener: () => {} } },
  tabs: {
    query: (q, cb) => { if (typeof cb === "function") cb([]); return Promise.resolve([]); },
    captureVisibleTab: () => Promise.resolve(window.__shot),
    sendMessage: (id, msg) => { window.__sent.push(msg); return new Promise((res) => { let done = false;
      for (const fn of window.__listeners) fn(msg, {}, (r) => { done = true; res(r); }); if (!done) res(undefined); }); }
  }
} });
if (mode === "tainted") HTMLCanvasElement.prototype.toDataURL = function () { throw new DOMException("Tainted canvases may not be exported.", "SecurityError"); };
if (mode === "novideo") { window.__mockReady = true; }
else {
  const src = document.createElement("canvas"); src.width = 1280; src.height = 720;
  const g = src.getContext("2d"); let f = 0;
  // 0: Kyurem ex held up, 1: a different card, 2: empty table, 3 and 4: a far camera (card ~18% of the width, as on a 720p
  // portrait stream) showing two
  // different cards in the same spot, the case a whole-frame comparison missed live
  window.__scene = 0;
  const SC = [["#3a6ea5", "#f3e9c6", "Kyurem ex", "157/086", 500, 120, 280, 400], ["#7a2e2e", "#c9e4f5", "Cetitan ex", "210/182", 200, 120, 280, 400], ["#2e5a2e", null, "", "", 0, 0, 0, 0],
    ["#555555", "#f3e9c6", "Numel", "223", 530, 220, 230, 320], ["#555555", "#2b2140", "Gengar ex", "154", 530, 220, 230, 320]];
  const draw = () => { const [bg, card, nm, num, x, y, w, h] = SC[window.__scene]; g.fillStyle = bg; g.fillRect(0, 0, 1280, 720);
    if (card) { g.fillStyle = card; g.fillRect(x, y + (f++ % 4), w, h); g.fillStyle = "#888"; g.font = "bold " + Math.round(w / 11) + "px sans-serif"; g.fillText(nm, x + w / 14, y + h / 9); g.fillText(num, x + w / 14, y + h - 10); } };
  draw(); setInterval(draw, 100);
  const v = document.createElement("video"); v.id = "v"; v.muted = true; v.autoplay = true; v.playsInline = true;
  v.srcObject = src.captureStream(10); document.body.appendChild(v);
  v.addEventListener("playing", () => { const w = () => v.videoWidth ? (window.__mockReady = true) : setTimeout(w, 50); w(); });
  v.play();
}
</script></body></html>
