name: Phone app

# Builds the Android APK (android/). On main, the APK is also attached to the "phone-latest" pre-release so it can be
# installed from the phone's browser. Signing: add the repo secrets CC_KEYSTORE_B64 (base64 of a .jks),
# CC_KEYSTORE_PASS and, if not "cardcomp", CC_KEY_ALIAS, so every build installs over the previous one. Without
# them a throwaway key is made per build and the old app must be uninstalled first (android/README.md).

on:
  push:
    paths:
      - "android/**"
      - "phone/**"
      - "extension/recog/recog-read.js"
      - "extension/recog/imgmatch.js"
      - "extension/store.js"
      - "extension/tcgfast.js"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Signing key
        env:
          KS_B64: ${{ secrets.CC_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.CC_KEYSTORE_PASS }}
          KS_ALIAS: ${{ secrets.CC_KEY_ALIAS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/cc.jks"
            echo "CC_KEYSTORE=$RUNNER_TEMP/cc.jks" >> "$GITHUB_ENV"
            echo "CC_KEYSTORE_PASS=$KS_PASS" >> "$GITHUB_ENV"
            echo "CC_KEY_ALIAS=${KS_ALIAS:-cardcomp}" >> "$GITHUB_ENV"
            echo "signing with the repo keystore"
          else
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/throwaway.jks" -storepass throwaway -keypass throwaway -alias cardcomp \
              -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=CardComp throwaway"
            echo "CC_KEYSTORE=$RUNNER_TEMP/throwaway.jks" >> "$GITHUB_ENV"
            echo "CC_KEYSTORE_PASS=throwaway" >> "$GITHUB_ENV"
            echo "CC_KEY_ALIAS=cardcomp" >> "$GITHUB_ENV"
            echo "::warning::no CC_KEYSTORE_B64 secret: signed with a throwaway key, uninstall the old build before installing this one"
          fi
      - name: Build
        env:
          CC_BUILD: ${{ github.sha }}
        run: |
          mkdir -p android/app/src/main/assets
          cp phone/bridge.js extension/recog/recog-read.js extension/recog/imgmatch.js extension/store.js extension/tcgfast.js android/app/src/main/assets/
          gradle -p android assembleRelease --no-daemon --console=plain
          cp android/app/build/outputs/apk/release/app-release.apk "cardcomp-phone-${GITHUB_SHA::7}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk cardcomp-phone.apk
      - uses: actions/upload-artifact@v4
        with:
          name: cardcomp-phone-${{ github.sha }}
          path: cardcomp-phone-*.apk
      # the download link and the in-app update only ever get main builds, or a build someone ran by hand (Run workflow)
      - name: Release (direct download link)
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view phone-latest >/dev/null 2>&1 || gh release create phone-latest --prerelease --title "CardComp phone (latest)" \
            --notes "Latest APK of the phone overlay (android/). Install from the phone: download, open, allow the install."
          gh release upload phone-latest cardcomp-phone.apk --clobber
          gh release edit phone-latest --notes "Latest APK of the phone overlay (android/), built from ${GITHUB_SHA::7} on $(date -u +%F)."
