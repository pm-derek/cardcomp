<!doctype html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CardComp — search POC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0d10; --panel:#14181d; --panel2:#1b2026; --line:#2a313a;
    --ink:#e8edf2; --dim:#8b97a5; --faint:#5b6573;
    --gold:#f5b301; --green:#5fd6a0; --blue:#6db5ff; --red:#ff6b6b;
    --radius:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"JetBrains Mono",ui-monospace,monospace}
  .wrap{max-width:680px;margin:0 auto;padding:9px 16px 80px;position:relative}
  h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:21px;margin:0;letter-spacing:-.5px}
  h1 .dot{color:var(--gold)}
  .sub{color:var(--faint);font-size:11px;letter-spacing:2px;text-transform:uppercase;margin:1px 0 7px}
  .banner{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:10px;padding:10px 13px;font-size:12px;color:var(--dim);line-height:1.55;margin-bottom:14px}
  .banner b{color:var(--ink)}
  .searchrow{display:flex;gap:10px}
  #q{flex:1;width:100%;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:var(--radius);padding:15px 16px;font-family:inherit;font-size:17px;outline:none}
  #q:focus{border-color:var(--gold)}
  .ex{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
  .ex span{background:var(--panel2);border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:6px 11px;font-size:12px;cursor:pointer}
  .ex span:hover{border-color:var(--gold);color:var(--ink)}
  #read{color:var(--blue);font-size:13px;margin:14px 2px 4px;min-height:16px}
  #read .f{color:var(--gold)}
  #status{color:var(--dim);font-size:12px;margin:6px 2px 10px}
  .card{display:flex;gap:9px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:7px;margin-top:5px}
  .card img{width:60px;height:84px;object-fit:contain;border-radius:6px;background:#0e1115;flex:none}
  /* Bigger pictures (Derek, 2026-10: "picture previews need to be bigger", to check the card on stream against the
     result): list rows 60x84 (44x62 before), an opened card 120x168 (also when opened from tiles). Tiles keep
     their crop: the whole card made each tile ~40% taller, one row per screen instead of two.
     Phone (440px and under) keeps 44x62: a bigger picture squeezed the card name from 76px to 24px. */
  .card.open > .row img{width:120px;height:168px}
  .meta{min-width:0;flex:1}
  .nm{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:15px;line-height:1.15}
  .tags{color:var(--dim);font-size:11px;margin-top:2px}
  .tags b{color:var(--blue);font-weight:500}
  .attrs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
  .pill{font-size:11px;padding:3px 8px;border-radius:6px;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
  .pill.hp{color:var(--green);border-color:#2d4a3c}
  .pill.ty{color:#0b0d10;font-weight:700}
  .pill.st{color:var(--ink)}
  .atk{color:var(--faint);font-size:11px;margin-top:6px}
  .atk b{color:var(--dim);font-weight:500}
  .hit{box-shadow:0 0 0 1px var(--gold) inset}
  .card{display:block}
  .row{display:flex;gap:12px;cursor:pointer}
  .card.open{border-color:var(--gold)}
  .card img.noimg{visibility:hidden}
  .tap{color:var(--faint);font-size:11px;margin-top:8px}
  .card.open .tap{display:none}
  .detail{display:none;margin-top:9px;border-top:1px solid var(--line);padding-top:9px}
  .card.open .detail{display:block}
  .muted{color:var(--dim);font-size:12px;line-height:1.5}
  .pchips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
  .sug{display:none;gap:6px;overflow-x:auto;white-space:nowrap;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .sug::-webkit-scrollbar{display:none}
  .sug.on{display:flex}
  .sug button{flex:none;background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:8px 13px;font-size:15px;font-family:inherit;cursor:pointer;line-height:1.1}
  .sug button.sel{border-color:var(--gold);background:rgba(245,179,1,.12)}   /* keyboard highlight: Tab/Enter picks it */
  .sug button i{font-style:normal;color:var(--faint);font-size:11px;margin-left:5px}
  .pchip{font-size:11px;padding:4px 8px;border-radius:999px;border:1px solid var(--line);color:var(--dim);cursor:pointer;white-space:nowrap}
  .pchip.on{border-color:var(--gold);color:var(--ink);background:rgba(245,179,1,.10)}
  .maxbid{font-size:13px;margin-bottom:9px}
  /* horizontal: options across, metrics down. 4 short rows, fits a half-screen phone */
  .bidtbl{display:grid;grid-template-columns:repeat(4,1fr);gap:1px 6px;align-items:baseline;margin-bottom:6px;text-align:center}
  .bidtbl .lb{font-size:8.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.2px;white-space:nowrap}
  .bidtbl .v{font-family:"Bricolage Grotesque",sans-serif;font-size:16px;color:var(--gold);line-height:1.25}
  .bidtbl .v.dn{color:var(--green)}
  .bidtbl .v.up{color:var(--ink)}
  .bidtbl .v.be{color:var(--blue)}
  .bidtbl .pc{font-size:10.5px;color:var(--dim);line-height:1.2}
  .bidtbl .nt{font-size:11px;font-weight:600;line-height:1.2}
  .maxbid .mbsub{color:var(--faint);font-size:11px;line-height:1.45}
  /* stream stats panel (under the sticky search row, opened from "stats" in the lot strip) */
  /* a bottom sheet over the results, not a block between search and results (Derek: it pushed the results down) */
  #lotstats{position:fixed;left:0;right:0;bottom:0;z-index:45;max-width:680px;margin:0 auto;max-height:75vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-bottom:none;border-radius:14px 14px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.55);padding:12px 12px 14px;font-size:12.5px}
  #lotstats .lsclose{background:none;border:1px solid var(--line);border-radius:8px;color:var(--dim);font:inherit;font-size:13px;padding:4px 9px;cursor:pointer}
  #lotstats .lshead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:9px}
  #lotstats .lshead b{font-size:13.5px;color:var(--ink)}
  #lotstats .lsdash{color:var(--gold);font-size:12px;cursor:pointer;text-decoration:underline dotted;padding:4px 2px}
  #lotstats .lssel{background:var(--panel2);border:1px solid var(--line);border-radius:7px;color:var(--ink);font:inherit;font-size:12px;padding:5px 6px;max-width:170px}
  #lotstats .lschips{margin-left:auto;display:flex;gap:4px}
  #lotstats .lschips span{cursor:pointer;padding:5px 9px;border-radius:999px;border:1px solid var(--line);color:var(--dim);font-size:11.5px}
  #lotstats .lschips span.on{border-color:var(--gold);color:var(--ink);background:rgba(245,179,1,.10)}
  #lotstats .lsverdict{display:flex;gap:9px;align-items:flex-start;border-left:3px solid;border-radius:6px;background:var(--panel2);padding:8px 10px;margin-bottom:10px;line-height:1.4;color:var(--dim)}
  #lotstats .lsverdict b{color:var(--ink)}
  #lotstats .lsicon{font-weight:800;font-size:14px;line-height:1.2}
  #lotstats .lstiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
  #lotstats .lst{background:var(--panel2);border-radius:9px;padding:8px 9px;min-width:0}
  #lotstats .lsl{font-size:10.5px;color:var(--faint)}
  #lotstats .lsv{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:22px;color:var(--ink);line-height:1.15;margin:2px 0}
  #lotstats .lss{font-size:10.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis}
  #lotstats .lslegend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--dim);margin-bottom:2px}
  #lotstats .lslegend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px;box-sizing:border-box}
  #lotstats .lsmuted{color:var(--faint)}
  #lotstats .lsax{fill:var(--faint);font-size:10px}
  #lotstats .lsref{fill:var(--dim);font-size:10px}
  #lotstats .lsdot{cursor:pointer}
  #lotstats .lstip{position:absolute;z-index:5;width:190px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:11.5px;line-height:1.45;color:var(--dim);pointer-events:none}
  #lotstats .lstip b{color:var(--ink)}
  #lotstats .lsx{font-size:11px;color:var(--faint);margin:4px 0 6px}
  #lotstats .lstab{width:100%;border-collapse:collapse;font-size:11.5px;font-variant-numeric:tabular-nums}
  #lotstats .lstab th{text-align:left;font-weight:500;color:var(--faint);font-size:10px;padding:4px 4px;border-bottom:1px solid var(--line)}
  #lotstats .lstab td{padding:5px 4px;border-bottom:1px solid var(--line);color:var(--dim)}
  #lotstats .lstab tr.me td{background:rgba(51,168,118,.12);color:var(--ink);font-weight:600}
  #lotstats .lstab tr.me td:first-child{box-shadow:inset 3px 0 0 #33a876}
  #lotstats .lstab tbody tr{cursor:pointer}
  #lotstats .lstab tr.pick td{background:rgba(255,107,107,.08)}
  #lotstats .lstab td.lsdel{width:1%;padding:0 2px;text-align:right}
  #lotstats .lsaddb{background:rgba(245,179,1,.12);border:1px solid var(--gold);border-radius:7px;color:var(--ink);font:inherit;font-size:12px;padding:5px 9px;cursor:pointer;white-space:nowrap}
  #pickbar{display:none;position:sticky;top:0;z-index:20;margin:0 0 10px;padding:10px 12px;border:1px solid var(--gold);border-left-width:4px;border-radius:10px;background:var(--panel);font-size:13px;line-height:1.45;color:var(--dim)}
  #pickbar b{color:var(--ink)} #pickbar button{background:none;border:1px solid var(--line);border-radius:7px;color:var(--dim);font:inherit;font-size:12px;padding:5px 10px;cursor:pointer;margin-left:6px}
  .pickrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 10px;padding:9px 10px;border:1px dashed var(--gold);border-radius:9px;font-size:12.5px;color:var(--dim)}
  .pickrow b{color:var(--ink)} .pickrow button{background:rgba(245,179,1,.14);border:1px solid var(--gold);border-radius:8px;color:var(--ink);font:inherit;font-weight:700;font-size:13px;min-width:48px;padding:9px 10px;cursor:pointer}
  #lotstats .lsdelb{background:rgba(255,107,107,.12);border:1px solid var(--red);border-radius:7px;color:var(--ink);font:inherit;font-size:12px;padding:5px 9px;cursor:pointer;white-space:nowrap}
  #lotstats .lsyou{color:var(--ink);background:rgba(51,168,118,.25);border-radius:5px;padding:1px 6px}
  #lotstats .lsclear{margin-top:10px;padding-top:9px;border-top:1px solid var(--line);font-size:11.5px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
  #lotstats .lsclear button{background:var(--panel2);border:1px solid var(--line);border-radius:7px;color:var(--dim);font:inherit;font-size:11.5px;padding:6px 10px;cursor:pointer}
  #lotstats .lsclear button:hover{border-color:var(--red);color:var(--ink)}
  /* Wide window (Derek, 2026-10: the side panel dragged wide): stats become a right column beside search, not a drawer over it */
  @media (min-width:1120px){
    #lotstats{top:0;bottom:0;left:auto;right:0;width:430px;max-width:none;max-height:none;margin:0;border-radius:0;border:none;border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(0,0,0,.35)}
    #lotstats .lstiles{grid-template-columns:repeat(2,1fr)}
    #lotstats .lssel{max-width:120px}
    body.lsopen .wrap{margin-right:max(16px,calc((100vw - 430px - 680px)/2 + 430px));margin-left:max(0px,calc((100vw - 430px - 680px)/2))}
    body.lsopen #cart{right:430px !important}   /* !important: #cart carries an inline right:0 (the bar slid under the stats column) */
  }
  @media (max-width:440px){ #lotstats .lstiles{grid-template-columns:repeat(2,1fr)} #lotstats .lstab th:nth-child(4),#lotstats .lstab td:nth-child(4){display:none} }
  /* condition grid: the max bid is the thing tapped live, so it is a wide button filling the middle;
     every tap target is at least ~40px tall (phone thumb, side panel mouse) */
  .condgrid{display:grid;grid-template-columns:auto auto minmax(92px,1fr) auto auto auto;gap:7px 10px;font-size:13.5px;align-items:center}
  .condgrid .pc{color:var(--dim);font-size:11px;text-align:right}
  .condgrid .h{font-size:9.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.5px}
  .condgrid .bd.h{text-align:center}
  .condgrid .c{font-weight:700}
  .condgrid .c .clink,.condgrid .mk .clink{display:inline-block;padding:10px 2px}
  .condgrid .clink{text-decoration:underline dotted;text-underline-offset:2px}
  .condgrid .carr{font-size:9px;opacity:.6;vertical-align:1px}
  .condgrid .mk{color:var(--dim)}
  .condgrid .bd.cpy{display:block;text-align:center;font-weight:800;font-size:17px;line-height:1;padding:11px 8px;border:1px solid currentColor;border-radius:9px;background:rgba(255,255,255,.04);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .condgrid .bd.cpy:hover{background:rgba(255,255,255,.09)}
  .condgrid .bd.cpy:active{transform:scale(.97)}
  .condgrid .mg{font-weight:600;text-align:right}
  @media (max-width:440px){ .card img,.card.open > .row img,#results.grid .card.open img{width:44px;height:62px} }   /* phone: names keep their width; tap the picture for full size */
  @media (max-width:440px){   /* phone: drop the % column so the bid button keeps its width */
    .condgrid{grid-template-columns:auto auto minmax(80px,1fr) auto auto;gap:7px 7px}
    .condgrid .pc{display:none}
  }
  .condgrid .cadd{width:48px;height:40px;background:rgba(245,179,1,.12);border:1px solid var(--gold);border-radius:9px;color:var(--ink);cursor:pointer;font-size:13px;line-height:1;padding:0}
  .finep{color:var(--faint);font-size:10.5px;margin-top:11px;line-height:1.5}
  .gear{position:absolute;top:9px;right:16px;background:var(--panel);border:1px solid var(--line);color:var(--dim);border-radius:10px;padding:7px 11px;font-size:12px;cursor:pointer;font-family:inherit}
  .gear:hover{color:var(--ink);border-color:var(--gold)}
  .settings{display:none;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 14px}
  .settings.open{display:block}
  .settings h4{margin:0 0 9px;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--faint);font-weight:600}
  .sgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px 12px}
  .sgrid label,.multrow label{font-size:11px;color:var(--dim);display:flex;flex-direction:column;gap:3px}
  .settings input{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:7px 9px;font-family:inherit;font-size:13px;outline:none;width:100%}
  .settings input:focus{border-color:var(--gold)}
  .multrow{display:flex;gap:8px;margin-top:6px}
  .multrow label{flex:1;text-align:center;font-size:10px;color:var(--faint)}
  .multrow input{text-align:center;padding:6px 2px}
  .flagstrip{display:flex;gap:8px}
  .fbtn{flex:1;font-family:inherit;font-size:12px;font-weight:600;padding:8px 0;border-radius:9px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;line-height:1}
  .fbtn.fg{color:var(--green)}
  .fbtn.fy{color:var(--gold)}
  .fbtn.fr{color:var(--red)}
  .flagstrip.idle .fbtn{opacity:.3;pointer-events:none}
  body.nofeedback .flagstrip,body.nofeedback .undobar,body.nofeedback .rails,body.nofeedback .detailflags{display:none!important}
  .undobar{display:none;width:100%;font-family:inherit;font-size:12px;font-weight:600;padding:8px 0;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--blue);cursor:pointer;line-height:1}
  /* one size system for header controls: .tgl = segmented selectors (game/lang), .fpill = filter pills (era/mode/reset) */
  .tgl{font-family:inherit;font-size:12px;font-weight:600;padding:8px 13px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--dim);cursor:pointer;line-height:1;white-space:nowrap}
  .fpill{font-family:inherit;font-size:12px;font-weight:500;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);color:var(--dim);cursor:pointer;line-height:1;white-space:nowrap}
  .rails{flex:none;display:flex;align-self:stretch;margin-left:8px;border-left:1px solid var(--line)}
  .rail{width:30px;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer}
  .rail.rg{color:var(--green)}
  .rail.ry{color:var(--gold);border-left:1px solid var(--line)}
  .bids{flex:none;text-align:right;white-space:nowrap;align-self:center;line-height:1.35}
  .bids .brow .blab{color:var(--faint);font-size:9.5px;letter-spacing:.3px;margin-right:4px}
  .bids .brow .bpc{color:var(--dim);font-size:10px;margin-left:4px}
  .spd{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.3px;line-height:1;padding:3px 9px;border-radius:999px;margin-left:5px;white-space:nowrap;border:1px solid currentColor}
  .spd.fast{color:var(--green)} .spd.slow{color:var(--gold)}
  .bids .bs{gap:0}
  .bids .bs .spd{margin-left:0;margin-right:6px}
  .bids .bs .flat{color:var(--faint);font-size:11px;font-weight:600;cursor:pointer;text-decoration:underline dotted}
  .bids .rounded{display:none}   /* tiles show the whole-dollar bid you actually type; list shows the exact */
  /* tile view: art-first grid for split-screen, where a 44px thumbnail is too small to identify a card */
  /* minmax(0,1fr) not 1fr: auto min-width lets the nowrap bid row force tiles wider than the container */
  #results.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;align-items:start}
  #results.grid[data-cols="2"]{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
  #results.grid[data-cols="4"]{grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
  #results.grid .card{flex-direction:column;padding:6px;margin-top:0;min-width:0}
  /* denser columns: shrink the type and drop the bid labels, colour still says which is which */
  #results.grid[data-cols="3"] .card,#results.grid[data-cols="4"] .card{padding:4px}
  #results.grid[data-cols="3"] .nm{font-size:11px;-webkit-line-clamp:1}
  #results.grid[data-cols="4"] .nm{font-size:10px;-webkit-line-clamp:1}
  #results.grid[data-cols="3"] .tags,#results.grid[data-cols="4"] .tags{font-size:9px}
  #results.grid[data-cols="3"] .bids .blab,#results.grid[data-cols="4"] .bids .blab{display:none}
  #results.grid[data-cols="3"] .bids{gap:2px 7px}
  #results.grid[data-cols="4"] .bids{gap:2px 5px}
  #results.grid[data-cols="3"] .bids .brow b{font-size:11.5px}
  #results.grid[data-cols="4"] .bids .brow b{font-size:10.5px}
  #results.grid[data-cols="3"] .row,#results.grid[data-cols="4"] .row{gap:3px}
  #results.grid .row{min-width:0}
  #results.grid .card.open{grid-column:1/-1}
  #results.grid .row{flex-direction:column;gap:5px}
  /* crop to the top ~71% of the card: name + full art, which is what you recognise on stream.
     Drops ~66px per tile versus showing the whole card, so more fit on screen. */
  #results.grid .card img{width:100%;height:auto;aspect-ratio:1/1;object-fit:cover;object-position:50% 0%}
  #results.grid .nm{font-size:13px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  #results.grid .tags{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #results.grid .xtra,#results.grid .rails,#results.grid .bids .bpc,#results.grid .bids .exact{display:none}
  #results.grid .bids .rounded{display:inline}
  #results.grid .bids{width:100%;min-width:0;display:flex;gap:4px 11px;flex-wrap:wrap;white-space:normal;text-align:left;align-self:auto}
  #results.grid .bids .brow{display:flex;gap:3px;align-items:baseline}
  #results.grid .bids .brow .blab{font-size:8px;margin-right:0}
  #results.grid .bids .brow b{font-size:13px}
  /* an opened tile spans the row and falls back to the list layout so the detail reads normally */
  /* Tiles: the bids are tapped straight from results (Derek knows the card), so they are chips, not small text.
     Margin bid = gold chip ~34px tall; b/e = smaller outlined chip. Fits 4 columns in the side panel. */
  #results.grid .card:not(.open) .bids{gap:5px 6px;align-items:center}
  #results.grid .card:not(.open) .bids .bm b.rounded,#results.grid .card:not(.open) .bids .bp b{display:inline-block;border-radius:8px;line-height:1;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;cursor:pointer}

// Dot strip: every labeled lot at its sale price as % of market. Emphasis form: your wins filled green,
// lots you bid on and lost filled gray, the rest hollow gray. Reference lines: 100% market, your usual max.
function lotDotStrip(host, S){
  if(!S.n){ host.innerHTML=""; return; }
  const W=Math.max(260, host.clientWidth||520), H=86, padL=14, padR=20, y0=18, y1=60;
  const ps=S.lab.map(r=>r.f/r.m);
  const hi=Math.min(2, Math.max(1.25, Math.ceil((Math.max(...ps)+0.05)*4)/4));   // domain hugs the data, always shows 100% (market)
  const lo=Math.min(0.5, Math.max(0, Math.floor((Math.min(...ps)-0.05)*4)/4));
  const x=p=>padL+((Math.min(Math.max(p,lo),hi)-lo)/(hi-lo))*(W-padL-padR);
  const WIN="#33a876", OTHER="#6b7685", SURF="var(--panel)";
  const mine=r=>Math.max(r.mx||0, r.pm||0)>0;
  const rows=S.lab.slice(-120);
  // simple beeswarm: place each dot in the lowest lane (of 4) not crowded within 9px
  const lanes=[[],[],[],[]], ly=i=>y0+8+i*((y1-y0-8)/3);
  const dots=rows.map(r=>{ const cx=x(r.f/r.m); let L=0; for(;L<4;L++){ if(!lanes[L].some(v=>Math.abs(v-cx)<9)) break; } L=Math.min(L,3); lanes[L].push(cx); return {r,cx,cy:ly(L)}; });
  const ticks=[0,0.25,0.5,0.75,1,1.25,1.5,1.75,2].filter(g=>g>=lo && g<=hi && (hi-lo<=1 || g*4%2===0));
  const grid=ticks.map(g=>`<line x1="${x(g)}" x2="${x(g)}" y1="${y0}" y2="${y1+4}" stroke="var(--line)" stroke-width="1"/><text x="${x(g)}" y="${H-6}" text-anchor="${g===lo?"start":g===hi?"end":"middle"}" class="lsax">${Math.round(g*100)}%${g===1?" mkt":""}</text>`).join("");
  const ref=S.maxPct!=null?`<line x1="${x(S.maxPct)}" x2="${x(S.maxPct)}" y1="${y0-6}" y2="${y1+4}" stroke="var(--gold)" stroke-width="2"/><text x="${x(S.maxPct)}" y="${y0-9}" text-anchor="${x(S.maxPct)>W-90?"end":x(S.maxPct)<60?"start":"middle"}" class="lsref">your max ~${Math.round(S.maxPct*100)}%</text>`:"";
  const marks=dots.map((d,i)=>{ const won=d.r.me, bid=mine(d.r);
    const fill=won?WIN:(bid?OTHER:"none"), stroke=won?WIN:OTHER;
    return `<g class="lsdot" data-i="${i}"><circle cx="${d.cx}" cy="${d.cy}" r="10" fill="transparent"/><circle cx="${d.cx}" cy="${d.cy}" r="5" fill="${fill}" stroke="${fill==="none"?stroke:SURF}" stroke-width="2"/></g>`; }).join("");
  host.innerHTML=`<div class="lslegend"><span><i style="background:${WIN}"></i>you won</span><span><i style="background:${OTHER}"></i>you bid, lost</span><span><i style="border:2px solid ${OTHER}"></i>others</span><span class="lsmuted">sale price as % of market</span></div>
    <div style="position:relative"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Lot sale prices as percent of market">${grid}${ref}${marks}</svg><div class="lstip" style="display:none"></div></div>`;
  const tip=host.querySelector(".lstip");
  host.querySelectorAll(".lsdot").forEach(g=>{ const d=dots[+g.dataset.i], r=d.r, n=r.np!=null?r.np-r.f:null;
    const show=()=>{ tip.innerHTML=`<b>${escH(r.n||"card")}</b> ${escH(r.c||"")}<br>sold $${r.f} · ${Math.round(r.f/r.m*100)}% of $${r.m.toFixed(2)}<br>${r.me?"you won":"won by "+escH(r.w||"?")}${n!=null?` · ${n>=0?"+":"−"}$${Math.abs(n).toFixed(2)} at that price`:""}${Math.max(r.mx||0,r.pm||0)?` · your max $${Math.max(r.mx||0,r.pm||0)}`:""}`;
      tip.style.display="block"; const left=Math.min(Math.max(d.cx-90,0), W-190); tip.style.left=left+"px"; tip.style.top=(d.cy+12)+"px"; };
    g.addEventListener("mouseenter", show); g.addEventListener("click", (e)=>{ e.stopPropagation(); show(); }); g.addEventListener("mouseleave", ()=>{ tip.style.display="none"; }); });
}

let CART = [];

function addToCart(item){

}
function clearCart(){ CART=[]; saveCart(); renderCart(); }
function openFromCart(item){

  const g = (card&&card.game) || item.game || (String(item.id||"").startsWith("lc:")?"lorcana":String(item.id||"").startsWith("op:")?"onepiece":"pkmn");
  const l = (card&&card.lang) || item.lang || "en";

  const it=$("#cartitems"); if(it) it.style.display="none";
  PRINT_HINT = (item.printing||"").toLowerCase();   // open the detail on the printing it was carted at
  if(card){ $("#read").innerHTML=""; render([{...card, score:1}], false, true); }   // deterministic: draw just this card
  else { run(item.n||""); }   // card gone from catalog: fall back to name search

  { const t=$("#cartitems").querySelector(".carttot"); if(t) t.onclick=(e)=>{ e.stopPropagation(); copyAmt(t.dataset.bid, t); }; }
  $("#cartsum").innerHTML = `🛒 ${CART.length} card${CART.length>1?"s":""} <span style="color:var(--faint);font-size:11px">· tap to view</span>`;

/* ---------- search feedback log ---------- */
// One record per search, ring-buffered in localStorage. Three grades: green (good),
// yellow (worked, not great), red (bad). All three log and clear the field. Starting a
// new search without flagging logs "unflagged" (moved on, no judgment). Never required.
const SLOG_KEY="cardcomp_slog", SLOG_MAX=2000;
let SLOG=[]; try{ SLOG=JSON.parse(localStorage.getItem(SLOG_KEY)||"[]")||[]; }catch(e){ SLOG=[]; }
let CUR=null;            // live search episode: {t, raw, f, n, openedId}
let SUPPRESS_LOG=false;  // cart reopen: its run() is not a user search
let LAST=null, _snap=null;  // undo: LAST={rec,raw,openedId} restorable after a flag clear; _snap staged inside finalize
function slogSave(){ try{ localStorage.setItem(SLOG_KEY, JSON.stringify(SLOG)); }catch(e){} }
function compactFilters(f){
  const o={};
  const set=f.setName||(f.setCode?SET_CODES[f.setCode]:null);
  if(set) o.set=set;
  if(f.number) o.number=f.number;
  if(f.rarity) o.rarity=f.rarity.label;
  if(f.printing) o.printing=f.printingLabel||f.printing;
  if(f.type) o.type=f.type;
  if(f.stage) o.stage=f.stage;
  if(f.subtype) o.subtype=f.subtype;
  if(f.hp!=null) o.hp=f.hp;
  if(f.eraMin!=null) o.eraMin=f.eraMin;
  if(f.eraMax!=null) o.eraMax=f.eraMax;
  if(f.jp) o.jp=f.jp.code;
  return o;
}
function seedCUR(raw, f, n){
  if(SUPPRESS_LOG || !feedbackOn()) return;   // feedback off: no live episode, nothing logs
  LAST=null; _snap=null;   // starting or continuing a search retires any pending undo
  if(!CUR) CUR={t:Date.now(), openedId:null};
  CUR.raw=raw; CUR.f=compactFilters(f); CUR.n=n;
  paintStrip();
}
function finalize(fl, cardId){
  clearTimeout(t);
  const qel=$("#q");
  if(CUR && qel && qel.value.trim() && qel.value!==CUR.raw) run(qel.value);   // flush pending keystrokes into CUR
  if(!CUR || !(CUR.raw||"").trim()){ CUR=null; paintStrip(); return null; }
  const rec={t:CUR.t, q:CUR.raw, f:CUR.f, n:CUR.n, id:(cardId!==undefined&&cardId!==null)?cardId:(CUR.openedId||null), fl, g:GAME, l:LANG};
  if(MODE) rec.mode=MODE;   // active result-gating toggle, matters like game/lang
  if(ERA) rec.era=ERA;
  SLOG.push(rec);
  if(SLOG.length>SLOG_MAX) SLOG=SLOG.slice(-SLOG_MAX);
  slogSave();
  _snap={rec, raw:CUR.raw, openedId:CUR.openedId};   // staged; armUndo() promotes it on the clear paths only
  CUR=null; paintStrip();
  return rec;
}
function clearSearch(){   // reset for the next search; never logs (callers finalize first)
  clearTimeout(t);
  const qel=$("#q");
  if(qel) qel.value="";
  $("#qclear").style.display="none";
  $("#results").innerHTML=""; $("#read").innerHTML=""; $("#status").textContent="";
  CUR=null; paintStrip();
  if(qel) qel.focus();
}
function armUndo(){ if(_snap) LAST=_snap; _snap=null; }   // make the last flagged+cleared search restorable
function flagGood(id){ finalize("g", id); armUndo(); clearSearch(); }
function flagBad(){ finalize("r"); armUndo(); clearSearch(); }
function flagOk(id){ finalize("y", id); armUndo(); clearSearch(); }
function undoLast(){
  if(!LAST) return;
  const {rec, raw, openedId}=LAST;
  if(SLOG.length && SLOG[SLOG.length-1]===rec){ SLOG.pop(); slogSave(); updateSlogUI(); }   // drop the flag we just logged
  LAST=null; _snap=null;
  const m=rec.mode||"";                                   // restore the result-gating toggle it ran under
  MODE=["fa","bulk","val25","val50","promo","sealed"].includes(m)?m:""; paintToggles();
  ERA=["vintage","mid","modern"].includes(rec.era)?rec.era:""; paintEra();
  const qel=$("#q"); if(qel){ qel.value=raw||""; qel.focus(); }
  $("#qclear").style.display=(raw&&raw.trim())?"block":"none";
  run(raw||"");                                           // re-seed CUR + re-render results
  if(openedId && CUR) CUR.openedId=openedId;
  if(openedId){
    requestAnimationFrame(()=>{
      const el=[...$("#results").querySelectorAll(".card")].find(c=>c.dataset.id===openedId);
      if(el){ if(!el.classList.contains("open")){ const row=el.querySelector(".row"); if(row) row.click(); } el.scrollIntoView({behavior:"smooth",block:"center"}); }
    });
  }
}
function paintStrip(){
  const live=!!(CUR&&(CUR.raw||"").trim());
  const showUndo=!live && !!LAST;
  const s=$("#flagstrip"), u=$("#undobar");
  if(u) u.style.display=showUndo?"block":"none";
  if(s){ s.style.display=showUndo?"none":"flex"; s.classList.toggle("idle", !live); }   // undo replaces the (idle) strip in the same slot
}
function addDetailFlags(host, card){
  host.insertAdjacentHTML("beforeend", '<div class="detailflags"><button class="fbtn fg" type="button">✓ good</button><button class="fbtn fy" type="button">~ ok</button><button class="fbtn fr" type="button">✗ bad</button></div>');
  const d=host.querySelector(".detailflags"); if(!d) return;
  d.querySelector(".fg").onclick=(e)=>{ e.stopPropagation(); flagGood(card?card.id:null); };
  d.querySelector(".fy").onclick=(e)=>{ e.stopPropagation(); flagOk(card?card.id:null); };
  d.querySelector(".fr").onclick=(e)=>{ e.stopPropagation(); flagBad(); };
}

/* log viewer (settings panel) */
function slogSummaryHTML(){
  if(!SLOG.length) return "no searches logged yet";
  const c={g:0,y:0,r:0,u:0}; let uFound=0; SLOG.forEach(r=>{ if(c[r.fl]!=null) c[r.fl]++; if(r.fl==="u"&&r.id) uFound++; });
  const uMoved=c.u-uFound;
  return `${SLOG.length} logged · <b style="color:var(--green)">${c.g} good</b> · <b style="color:var(--gold)">${c.y} ok</b> · <b style="color:var(--red)">${c.r} bad</b> · ${c.u} unflagged (${uFound} found, ${uMoved} moved on)`;
}
const escH=s=>String(s).replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
function fmtFilters(f){ return Object.entries(f||{}).map(([k,v])=>k+" "+v).join(" · "); }
function renderSlog(){
  const body=$("#slogbody"); if(!body) return;
  const freq=new Map();
  SLOG.forEach(r=>{ const k=(r.q||"").toLowerCase().trim(); if(k.length>=3) freq.set(k,(freq.get(k)||0)+1); });   // skip 1-2 char interim noise
  const top=[...freq.entries()].sort((a,b)=>b[1]-a[1]).slice(0,15);
  const bad=SLOG.filter(r=>r.fl==="r"||r.fl==="y").slice(-50).reverse();
  // corrections: a missed/ok/unflagged search immediately refined into a green hit (same first word, within 90s)
  const w4=s=>(s||"").trim().toLowerCase().split(/\s+/)[0].slice(0,4);
  const corr=[];
  for(let i=1;i<SLOG.length;i++){ const p=SLOG[i-1], cc=SLOG[i]; if(cc.fl==="g" && p.fl!=="g" && p.q!==cc.q && w4(p.q)===w4(cc.q) && (cc.t-p.t)/1000<90 && w4(p.q)) corr.push([p,cc]); }
  const corrShow=corr.slice(-40).reverse();
  const h4=tt=>`<div style="font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:1px;margin:10px 0 5px">${tt}</div>`;
  body.innerHTML =
    h4("corrections · "+corr.length+" (query → fix)")+
    (corrShow.length?corrShow.map(([p,cc])=>`<div style="padding:3px 0;border-bottom:1px solid var(--line);color:var(--dim)">${escH(p.q)} <span style="color:var(--faint)">[${p.fl==="r"?"✗":p.fl==="y"?"~":"·"} ${p.n}]</span> <b style="color:var(--green)">→</b> ${escH(cc.q)} <span style="color:var(--faint)">[${cc.n}]</span></div>`).join(""):'<div class="muted">none yet</div>')+
    h4("top queries")+
    (top.length?top.map(([q,n])=>`<div style="display:flex;justify-content:space-between;gap:10px;padding:2px 0;color:var(--dim)"><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escH(q)}</span><span style="flex:none">${n}</span></div>`).join(""):'<div class="muted">none</div>')+
    h4("red + yellow · latest "+bad.length)+
    (bad.length?bad.map(r=>{
      const fs=fmtFilters(r.f);
      const md={fa:"full art",bulk:"hide bulk",val25:"$25+",val50:"$50+",promo:"promos",sealed:"sealed"}[r.mode]||"";
      const ea={vintage:"vintage",mid:"mid-era",modern:"modern"}[r.era]||"";
      return `<div style="padding:4px 0;border-bottom:1px solid var(--line)"><b style="color:${r.fl==="r"?"var(--red)":"var(--gold)"}">${r.fl==="r"?"✗":"~"}</b> ${escH(r.q)} <span style="color:var(--faint)">· ${r.n} result${r.n===1?"":"s"}${ea?" · "+ea:""}${md?" · "+md:""}${fs?" · "+escH(fs):""} · ${r.g}${r.g==="pkmn"?" "+(r.l||"en"):""} · ${new Date(r.t).toLocaleString()}</span></div>`;
    }).join(""):'<div class="muted">none</div>');
}
function updateSlogUI(){
  const s=$("#slogsum"); if(s) s.innerHTML=slogSummaryHTML();
  const b=$("#slogbody"); if(b && b.style.display!=="none") renderSlog();
}

/* ---------- domain layer ---------- */
const NICK = [
  [/\bzard\b/g,"charizard"],[/\bpika\b/g,"pikachu"],[/\bgard\b/g,"gardevoir"],
  [/\bgyara\b/g,"gyarados"],[/\bgren\b/g,"greninja"],[/\bttar\b/g,"tyranitar"],
  [/\blax\b/g,"snorlax"],[/\blucar\b/g,"lucario"],[/\bmence\b/g,"salamence"],
  [/\bchomp\b/g,"garchomp"],[/\bdnite\b/g,"dragonite"],
  // energy names as people say them vs as printed ("Electric Energy" is Lightning Energy on TCGplayer)
  [/\b(electric|electricity|yellow)\s+energy\b/g,"lightning energy"],[/\b(dark|black)\s+energy\b/g,"darkness energy"],
  [/\b(steel|silver)\s+energy\b/g,"metal energy"],[/\b(red)\s+energy\b/g,"fire energy"],[/\b(blue)\s+energy\b/g,"water energy"],
  [/\b(green)\s+energy\b/g,"grass energy"],[/\b(purple)\s+energy\b/g,"psychic energy"]
];
let _BIG=null, _BIGSRC=null;
function nameBigrams(){   // consecutive word pairs from every card name in the current game, for "is this phrase a name?"
  if(_BIGSRC===NAMESET) return _BIG;
  _BIG=new Set(); _BIGSRC=NAMESET;
  for(const n of NAMESET){ const w=n.replace(/[^a-z0-9' ]+/g," ").split(/\s+/).filter(Boolean); for(let i=0;i+1<w.length;i++) _BIG.add(w[i]+" "+w[i+1]); }
  return _BIG;
}
const TYPES = {fire:"Fire",water:"Water",grass:"Grass",lightning:"Lightning",electric:"Lightning",
  psychic:"Psychic",fighting:"Fighting",darkness:"Darkness",dark:"Darkness",metal:"Metal",steel:"Metal",
  dragon:"Dragon",fairy:"Fairy",colorless:"Colorless",normal:"Colorless"};
const TYPE_COLOR = {Fire:"#ff7043",Water:"#4fc3f7",Grass:"#7cc576",Lightning:"#ffd54f",Psychic:"#ba68c8",
  Fighting:"#d4a05a",Darkness:"#78909c",Metal:"#b0bec5",Dragon:"#cyan",Fairy:"#f06292",Colorless:"#cfd8dc"};
// set codes from the data; skip codes that are also Pokemon names
let NAMESET = new Set(), NUMSETS = new Set(), SET_NAMES = [];
const SET_CODES = {};
let ABBR = new Map();   // unique 3-4 char prefix -> full Pokemon name  (e.g. "zek" -> "zekrom")
let PHON = new Map();   // phonetic key -> Set(base name)  (sounds-like fallback for misspellings)
function phonKey(s){    // rough sounds-like skeleton: consonant frame, spelling-error tolerant
  s=(s||"").toLowerCase().replace(/[^a-z]/g,"");
  if(!s) return "";
  s=s.replace(/ph/g,"f").replace(/gh/g,"g").replace(/ck/g,"k").replace(/wh/g,"w").replace(/qu/g,"kw").replace(/x/g,"ks")
     .replace(/c(?=[eiy])/g,"s").replace(/c/g,"k").replace(/z/g,"s").replace(/y/g,"i");
  const first=s[0];
  const rest=s.slice(1).replace(/h/g,"").replace(/[aeiou]/g,"");   // drop non-initial h + vowels
  return (first+rest).replace(/(.)\1+/g,"$1");                     // collapse doubled letters
}
function buildVocab(){
  const pool = CARDS.filter(c=>(c.game||"pkmn")===GAME);
  NAMESET = new Set(pool.map(c=>c.n.toLowerCase()));
  for(const k in SET_CODES) delete SET_CODES[k];
  pool.forEach(c=>{ if(c.c) SET_CODES[c.c.toLowerCase()] = c.s; });
  NUMSETS = new Set(pool.filter(c=>/^\d+$/.test(c.s)).map(c=>c.s));
  SET_NAMES = [...new Set(pool.map(c=>c.s))].filter(s=>s.length>=4 && !/^\d+$/.test(s)).sort((a,b)=>b.length-a.length);
  // build prefix->name map from the current game's names; keep only prefixes that resolve to ONE name
  ABBR = new Map();
  const counts = new Map();
  for(const c of pool){
    if(c.sealed) continue;
    if(GAME==="pkmn" && (c.lang||"en")!=="en") continue;   // pokemon abbreviations from EN names only
    const base = (c.n||"").toLowerCase().split(/\s+/)[0].replace(/[^a-z]/g,"");
    if(base.length<5) continue;                       // only abbreviate names long enough to bother
    for(const L of [3,4]){ if(base.length<=L) continue; const pre=base.slice(0,L);
      if(!counts.has(pre)) counts.set(pre,new Set()); counts.get(pre).add(base); }
  }
  for(const [pre,set] of counts){ if(set.size===1) ABBR.set(pre,[...set][0]); }
  PHON = new Map();
  for(const c of pool){
    if(c.sealed) continue;
    if(GAME==="pkmn" && (c.lang||"en")!=="en") continue;
    const base=(c.n||"").toLowerCase().split(/\s+/)[0].replace(/[^a-z]/g,"");
    if(base.length<4) continue;
    const k=phonKey(base); if(!k) continue;
    if(!PHON.has(k)) PHON.set(k,new Set()); PHON.get(k).add(base);
  }
}

// Mechanic tiers that print in the card NAME (Charizard GX, Pikachu VMAX, Trevenant BREAK). Parsing
// them into a stage/subtype filter strips the word from the query, but ~60% of GX and ~half of VMAX
// cards are TCGCSV standalones/promos with an empty subtype array — so a subtype-only match drops
// every promo GX and, with the Promo toggle on, relaxes to non-GX junk. Match the name as a fallback.
const NAME_STAMPED = { gx:/\bgx\b/i, break:/\bbreak\b/i, vmax:/\bvmax\b/i, vstar:/\bvstar\b/i,
  v:/(^|\s)v(\s|$)/i, ex:/(^|[\s-])ex(\s|$)/i };   // v/ex: exact tag only, so "melmetal v" never pulls VMAX, ex or GX
// true if the card carries this stage/subtype tier either in its subtypes OR (for name-stamped tiers) its name
function stampOK(tier, r){
  if((r.st||[]).map(x=>x.toLowerCase()).includes(tier)) return true;
  const ns = NAME_STAMPED[tier];
  return !!(ns && ns.test(r.n||""));
}

function parse(raw){
  let text = " " + raw.toLowerCase().trim() + " ";
  const f = {hp:null,type:null,stage:null,subtype:null,delta:null,eraMin:null,eraMax:null,number:null,setCode:null,setName:null,rarity:null,jp:null,note:[],exp:[]};
  NICK.forEach(([re,v])=>{ if(re.test(text)){ f.exp.push(v); text = text.replace(re," "+v+" "); } });
  const qFull = text.replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(Boolean).join(" ");
  // e-Reader: the e-card era sets with dot-code strips. Filters to the whole group, either language
  if(/\be[\s-]?reader\b|\be[\s-]?card\b/.test(text)){ f.setIn=EREADER_SETS; text=text.replace(/\be[\s-]?reader\b|\be[\s-]?card\b/g," "); }
  if(/\bdelta( species)?\b|δ/.test(text)){ f.delta=true; text=text.replace(/\bdelta( species)?\b|δ/g," "); }

  // set: ptcgo code, nickname, full name  (rarity shorthands are reserved so they can't be read as a set code)
  // reserved 2-char tokens a set code must never hijack: rarity shorthands + card mechanics (ex->Expedition code "EX", gx)
  const RAR_CODES = new Set(["dr","ir","sir","ur","hr","rr","sr","ar","sar","ex","gx"]);
  // a code followed by "promo" ("sv promo") is a promo line (SET_NICK), not the code's set (Supreme Victors)
  for(const code in SET_CODES){ if(code.length>=2 && !RAR_CODES.has(code) && !NAMESET.has(code) && text.includes(" "+code+" ") && !text.includes(" "+code+" promo")){ f.setCode=code; text=text.replace(new RegExp("\\b"+code+"\\b","g")," "); break; } }
  // "base 2" / "base2" / "bs2" mean Base Set 2, not Base Set card #2. "base 2/102" keeps meaning #2 of 102.
  { const re=/\b(base\s?2|bs\s?2)\b(?!\s*\/)/;
    if(!f.setName && !f.setIn && re.test(text)){ f.setName="Base Set 2"; text=text.replace(re," "); } }
  // "30th" / "30th anniversary" / "30th celebration": the 30th Celebration set (+ its Classic Collection via
  // SET_GROUP in EN, M6a in JP). "30th celebration classic collection" stays exact (SET_NICK below).
  { const re=/\b30th(\s+(anniversary|celebrations?))?\b(?!\s*:?\s*classic)/;
    if(!f.setName && !f.setIn && re.test(text)){ f.setName="30th Celebration"; text=text.replace(re," "); } }
  // 25th anniversary (2021): "25th", "25th celebration(s)", "25th anniversary", "cel25", plural "celebrations"
  // all mean Celebrations + its Classic Collection + the McDonald's 25th promos (JP: the S8a family).
  // Singular "celebration" is left alone: that is the 30th. "celebrations classic collection" stays exact.
  { const re=/\b25th(\s+(anniversary|celebrations?))*\b|\bcel\s?25\b|\bcelebrations\b(?!\s*:?\s*classic)/;
    if(!f.setName && !f.setIn && re.test(text)){
      if(LANG==="jp") f.jpCodes=["s8a","s8a-g","s8a-p"];
      else { f.setIn=CEL25_SETS; f.setInLabel="Celebrations (25th)"; }
      text=text.replace(new RegExp(re.source,"g")," ");
    } }
  if(!f.setName){ for(const k in SET_NICK){ if(text.includes(k)){ f.setName=SET_NICK[k]; text=text.replace(k," "); f.setName.toLowerCase().replace(/[^a-z0-9]+/g," ").split(/\s+/).forEach(w=>{ if(w.length>2) text=text.replace(new RegExp("\\b"+w+"\\b","g")," "); }); break; } } }   // also consume the rest of the resolved set-name words (e.g. "prismatic evolutions" -> drop "evolutions" too)
  if(!f.setName){ for(const nm of SET_NAMES){ if(NAMESET.has(nm.toLowerCase())) continue; const re=new RegExp("\\b"+nm.toLowerCase().replace(/[^a-z0-9]+/g," ").trim().replace(/ /g,"[^a-z0-9]+")+"\\b"); if(re.test(text)){ f.setName=nm; text=text.replace(re," "); break; } } }   // skip set names that are also a Pokémon (e.g. "Arceus"): treat the word as the card, not the set, so "arceus vstar" searches the Pokémon

  let m = text.match(/\b(\d{2,3})\s*hp\b/) || text.match(/\bhp\s*(\d{2,3})\b/);
  if(m){ f.hp=+m[1]; text=text.replace(m[0]," "); }
  // "dark" is a card-name prefix (Dark Charizard, Dark Electrode - Team Rocket), not a type shorthand.
  // Only 30 of 168 "Dark X" cards are actually Darkness-type, so treating it as a type filter hid the rest.
  // "darkness" still selects the type.
  // A type word that is part of a real card name with the next word ("lightning energy", "double
  // colorless energy", "electric generator", "metal saucer") stays in the name; otherwise energy and
  // trainer cards (no type) got filtered out by a type they don't carry.
  m = text.match(/\b(fire|water|grass|lightning|electric|psychic|fighting|darkness|metal|steel|dragon|fairy|colorless|normal)\b(\s+([a-z0-9']+))?/);
  if(m && !(m[3] && nameBigrams().has(m[1]+" "+m[3]))){ f.type=TYPES[m[1]]; text=text.replace(new RegExp("\\b"+m[1]+"\\b")," "); }

  if(/\bstage\s*2\b/.test(text)){ f.stage="Stage 2"; text=text.replace(/\bstage\s*2\b/g," "); }
  else if(/\bstage\s*1\b/.test(text)){ f.stage="Stage 1"; text=text.replace(/\bstage\s*1\b/g," "); }
  else if(/\bvstar\b/.test(text)){ f.stage="VSTAR"; text=text.replace(/\bvstar\b/g," "); }
  else if(/\bvmax\b/.test(text)){ f.stage="VMAX"; text=text.replace(/\bvmax\b/g," "); }
  else if(/\btera\b/.test(text)){ f.stage="Tera"; text=text.replace(/\btera\b/g," "); }
  else if(/\bbasic\b/.test(text)){ f.stage="Basic"; text=text.replace(/\bbasic\b/g," "); }

  // plain "v" / "ex": exact mechanic tag (subtype or name), checked separately so "charizard ex tera" still works
  if(/(^|\s)v(\s|$)/.test(text)){ f.mech="v"; text=text.replace(/(^|\s)v(?=\s|$)/g," "); }
  else if(/(^|\s)ex(\s|$)/.test(text)){ f.mech="ex"; text=text.replace(/(^|\s)ex(?=\s|$)/g," "); }
  const SUB = [[/\bbaby\b/,"Baby"],[/\bgold star\b|\bstar\b/,"Star"],[/\bbreak\b/,"BREAK"],[/\bancient\b/,"Ancient"],[/\bfuture\b/,"Future"],[/\bmega\b/,"MEGA"],[/\bgx\b/,"GX"],[/\bprism star\b|\bprism\b/,"Prism Star"],[/\btag team\b/,"TAG TEAM"],[/\bultra beast\b|\bub\b/,"Ultra Beast"],[/\bsingle strike\b/,"Single Strike"],[/\brapid strike\b/,"Rapid Strike"],[/\bfusion( strike)?\b/,"Fusion"]];
  for(const [re,st] of SUB){ if(re.test(text)){ f.subtype=st; text=text.replace(re," "); break; } }

  if(/\b(vintage|wotc|old|classic(?!\s+collection))\b/.test(text)){ f.eraMax=2003; text=text.replace(/\b(vintage|wotc|old|classic(?!\s+collection))\b/g," "); }   // "classic collection" is a set (Celebrations / 30th Celebration), not an era
  if(/\b(modern|new|recent)\b/.test(text)){ f.eraMin=2020; text=text.replace(/\b(modern|new|recent)\b/g," "); }

  // printing selector: filters to that printing AND auto-selects it in the detail view
  const PRINTS = [
    [/\b(1st ?ed(ition)?|first ?ed(ition)?|1st|first)\b/, "1st edition", "1st Edition"],
    [/\bshadowless\b/, "shadowless", "Shadowless"],
    [/\bunlimited\b/, "unlimited", "Unlimited"]
  ];
  // "1st edition shadowless" (either order): both words matter. Only Base Set has that printing, so
  // taking just "1st edition" returned Neo Destiny's 1st Ed Machop first.
  if(PRINTS[0][0].test(text) && PRINTS[1][0].test(text)){ f.printing="shadowless 1st edition"; f.printingLabel="Shadowless 1st Edition"; f.eraMax=f.eraMax||2002; text=text.replace(PRINTS[0][0]," ").replace(PRINTS[1][0]," "); }
  else for(const [re,key,lab] of PRINTS){ if(re.test(text)){ f.printing=key; f.printingLabel=lab; if(key==="1st edition"){ f.eraMax=f.eraMax||2002; } text=text.replace(re," "); break; } }

  // finishes & printings -> deferred to price layer (recognized, not filtered here)
  const FIN = [
    [/\b(1st|first)\s?edition\b/,"1st Edition",()=>{f.eraMax=2002;}],
    [/\bshadowless\b/,"shadowless"],[/\bunlimited\b/,"unlimited"],
    [/\breverse(\s?holo)?\b/,"reverse holo"],[/\bnon[\s-]?holo\b/,"non-holo"],
    [/\brare holo\b/,"holo"],[/\bholo(foil)?\b/,"holo"],
    [/\bcosmos( holo)?\b/,"cosmos holo"],[/\bcracked ice\b/,"cracked ice"],
    [/\b(master\s?ball|poke\s?ball|pok[eé]\s?ball|pokeball)\b/,"Master/Poké Ball pattern"],
    [/\b(pre[\s-]?release|prerelease)\b/,"prerelease"],[/\bstaff\b/,"staff stamp"],
    [/\b(league|stamped|stamp)\b/,"stamp"],[/\b(jumbo|oversized)\b/,"jumbo"],
    [/\b(error|miscut|misprint)\b/,"error/misprint"]
  ];
  for(const [re,lab,fx] of FIN){ if(re.test(text)){ if(/master|poke|pok/.test(re.source)){ if(!text.replace(re," ").replace(/[^a-z0-9]+/g,"").length) continue; } if(fx) fx(); f.note.push(lab+" → printing (price layer)"); text=text.replace(re," "); } }

  // grading / condition -> comp source, not identity
  m = text.match(/\b(psa|bgs|cgc|sgc)\s?(10|9\.5|9|8\.5|8|7|6|5|4|3|2|1)?\b/);
  if(m){ f.note.push(m[0].toUpperCase().replace(/\s+/g," ").trim()+" → graded (eBay-sold comps)"); text=text.replace(m[0]," "); }
  if(/\b(graded|slab|gem mint)\b/.test(text)){ f.note.push("graded → eBay-sold comps"); text=text.replace(/\b(graded|slab|gem mint)\b/g," "); }
  if(/\b(raw|ungraded)\b/.test(text)){ f.note.push("raw"); text=text.replace(/\b(raw|ungraded)\b/g," "); }
  const cm = text.match(/\b(near mint|lightly played|moderately played|heavily played|damaged)\b/);
  if(cm){ f.note.push(cm[1]+" → condition (price layer)"); text=text.replace(cm[0]," "); }

  // Japanese rarity codes -> filter JP results by rarity (only when already in JP mode).
  // Carries the code to match against the card's rarity field, so e.g. "ar" can never mean a Pokémon.
  if(LANG==="jp"){
    const JPR = [
      [/\bspecial art rare\b|\bsar\b/, "SAR", "Special Art Rare"],
      [/\bart rare\b|\bar\b/,          "AR",  "Art Rare"],
      [/\bsuper rare\b|\bsr\b/,        "SR",  "Super Rare"],
      [/\bultra rare\b|\bur\b/,        "UR",  "Ultra Rare"],
      [/\bhyper rare\b|\bhr\b/,        "HR",  "Hyper Rare"],
      [/\bcharacter super rare\b|\bcsr\b/, "CSR", "Character Super Rare"],
      [/\bcharacter rare\b|\bchr\b/,   "CHR", "Character Rare"],
      [/\btriple rare\b|\brrr\b/,      "RRR", "Triple Rare"],
      [/\bdouble rare\b|\brr\b/,       "RR",  "Double Rare"]
    ];
    for(const [re,code,full] of JPR){ if(re.test(text)){ f.jp={code,full,label:full}; text=text.replace(re," "); break; } }
  }

  // alt art -> Sword & Shield era
  if(/\b(alt art|alternate art|aa)\b/.test(text)){ f.eraMin=2020; f.eraMax=2022; f.note.push("alt art → SWSH era (exact variant at price layer)"); text=text.replace(/\b(alt art|alternate art|aa)\b/g," "); }

  // English rarities
  const RAR = [
    [/\bace spec\b|\bace\b/, {label:"ACE SPEC", has:"ACE SPEC"}],
    [/\bspecial illustration rare\b|\bsir\b/, {label:"Special Illustration Rare", eq:"Special Illustration Rare"}],
    [/\bfull art\b/, {label:"Full Art", anyOf:["Rare Ultra","Ultra Rare"]}],
    [/\billustration rare\b|\bir\b/, {label:"Illustration Rare", eq:"Illustration Rare"}],
    [/\bdouble rare\b|\bdr\b|\brr\b/, {label:"Double Rare", eq:"Double Rare"}],
    [/\bultra rare\b|\bultra\b|\bur\b/, {label:"Ultra Rare", eq:"Ultra Rare"}],
    [/\bhyper rare\b|\bhr\b|\bgold\b/, {label:"Hyper Rare", eq:"Hyper Rare"}],
    [/\brainbow\b/, {label:"Rainbow", has:"Rainbow"}],
    [/\bsecret( rare)?\b/, {label:"Secret Rare", has:"Secret"}],
    [/\bradiant\b/, {label:"Radiant", has:"Radiant"}],
    [/\bshiny\b|\bshining\b/, {label:"Shining", has:"Shining"}],
    [/\bamazing( rare)?\b/, {label:"Amazing Rare", has:"Amazing"}],
    [/\bprime\b/, {label:"Prime", has:"Prime"}],
    [/\blegend\b/, {label:"LEGEND", eq:"LEGEND"}],
    [/\btrainer gallery\b|\btg\b/, {label:"Trainer Gallery", has:"Trainer Gallery"}],
    [/\bpromos?\b/, {label:"Promo", eq:"Promo"}],
    [/\buncommon\b/, {label:"Uncommon", eq:"Uncommon"}],
    [/\bcommon\b/, {label:"Common", eq:"Common"}],
    [/\brare\b/, {label:"Rare", eq:"Rare"}]
  ];
  for(const [re,mm] of RAR){ if(re.test(text)){ f.rarity=mm; text=text.replace(re," "); break; } }

  m = text.match(/#\s*([a-z]{0,3}\d{1,3}[a-z]?)\b/) || text.match(/\b(\d{1,3})\s*\/\s*(\d{1,3})\b/);
  if(m){ f.number=m[1]; if(m[2]) f.setSize=+m[2]; text=text.replace(m[0]," "); }   // "4/102": the 102 picks sets printed out of 102
  else { const bm = text.match(/\b(\d{1,3})\b/); if(bm){ if(NUMSETS.has(bm[1])) f.setName=bm[1]; else f.number=bm[1]; text=text.replace(bm[0]," "); } }
  // EN: a typed set code means its whole set. Codes are split within a set (Base Set 2 is "B2" for the
  // 65 main cards and "BS2" for 4 others; Celebrations CEL/CLB), so filter on the set name instead.
  if(LANG==="en" && f.setCode && !f.setName && SET_CODES[f.setCode]){ f.setName=SET_CODES[f.setCode]; f.setCode=null; }
  if(LANG==="en"){ const en=f.setName||(f.setCode?SET_CODES[f.setCode]:null), tw=en&&SET_TWINS[en];
    if(tw){ f.setIn=new Set([en,tw]); f.setInLabel=en; f.setName=null; f.setCode=null; }
    else if(SET_GROUP[en]){ f.setIn=SET_GROUP[en]; f.setInLabel=en+(/Fates/.test(en)?" + Shiny Vault":" + Classic"); f.setName=null; f.setCode=null; } }   // main set: include its Classic Collection
  if(LANG==="jp"){   // in JP mode, translate a recognized EN set (name or numeric like "151") into its JP analog code(s)
    const en = f.setName || (f.setCode ? SET_CODES[f.setCode] : null);
    const jn = en && EN_TO_JP_NAMES[String(en).toLowerCase()];
    const jc = en && EN_TO_JP[String(en).toLowerCase()];
    if(jn){ f.setIn=new Set(jn); f.setInLabel="JP "+en; f.setName=null; f.setCode=null; }   // by JP set name (named map wins)
    else if(jc){ f.jpCodes=jc; f.setName=null; f.setCode=null; }
    else if(en && !jpHasSet(en)){   // EN set with no JP twin (vintage JP sets have no codes and different names): match by era instead
      const y=enSetYear(en);
      if(y){ f.eraMax=Math.min(f.eraMax||9999, y); f.setName=null; f.setCode=null; f.note.push(en+" → JP by year"); }
    }
  }
  const q = text.replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(Boolean)
    .map(tok => (tok.length>=3 && tok.length<=4 && !NAMESET.has(tok) && ABBR.has(tok)) ? ABBR.get(tok) : tok)
    .join(" ");
  return {q,qFull,f};
}

/* ---------- index ---------- */
let ms = null;
function buildIndex(){
  ms = new MiniSearch({
    fields:["n","atk","s","kind"],
    storeFields:["n","sup","s","c","y","num","r","hp","t","st","atk","img","lang","game","px","pid","sealed","kind","o","d7","d30","ps"],
    searchOptions:{ boost:{n:3,atk:2}, fuzzy: t => t.length>4 ? 0.2 : false, prefix: t => t.length>=3 }
  });
  ms.addAll(CARDS);
}

/* ---------- search ---------- */
function run(raw){
  const {q,qFull,f} = parse(raw);
  if(f.jp){ setLang("jp", true); }
  // read-as line
  const bits = [];
  if(f.exp.length) bits.push("→ "+f.exp.join(", "));
  if(f.setCode) bits.push(SET_CODES[f.setCode]);
  if(f.setName) bits.push(f.setName);
  if(f.setIn) bits.push(f.setInLabel||"e-Reader");
  if(f.jpCodes) bits.push("JP "+f.jpCodes.join("/").toUpperCase());
  if(f.type) bits.push(f.type);
  if(f.hp!=null) bits.push(f.hp+" HP (±20)");
  if(f.stage) bits.push(f.stage);
  if(f.subtype) bits.push(f.subtype);
  if(f.mech) bits.push(f.mech==="v"?"V":"ex");
  if(f.delta) bits.push("δ Delta Species");
  if(f.rarity) bits.push(f.rarity.label);
  if(f.jp) bits.push(f.jp.label+" ("+f.jp.code+")");
  if(f.printing) bits.push(f.printingLabel||f.printing);
  if(f.number) bits.push("#"+f.number+(f.setSize?"/"+f.setSize:""));
  if(f.eraMax) bits.push("≤"+f.eraMax);
  if(f.eraMin) bits.push("≥"+f.eraMin);
  const noteStr = f.note.length ? ("  <span style='color:var(--faint)'>· "+f.note.join(" · ")+"</span>") : "";
  $("#read").innerHTML = (q||bits.length||f.note.length) ? ("read as: " + (q?('"'+q+'"'):"(no name)") + (bits.length?("  <span class='f'>· "+bits.join(" · ")+"</span>"):"") + noteStr) : "";

  const tlc = f.type && f.type.toLowerCase();
  const slc = f.stage && f.stage.toLowerCase();
  const passMode = r => {
    if(MODE==="sealed") return !!r.sealed;
    if(r.sealed) return false;                 // non-sealed modes never show sealed
    if(MODE==="fa")    return isChase(r);
    if(MODE==="bulk")  return !isBulk(r);
    if(MODE==="val25") return bestPx(r) >= 25;
    if(MODE==="val50") return bestPx(r) >= 50;
    if(MODE==="promo") return isPromo(r);
    return true;
  };
  // relax level: 0 = strict; >=1 drops loose descriptors (rarity, type, hp, delta) that most often over-narrow
  // to empty; >=2 additionally drops subtype/stage (e.g. "Baby" is often mis-tagged). Identity filters
  // (set, number, printing, era) are always kept, so a relaxed retry can never cross a set boundary.
  const passFilters = (r, hard) => {
    const lv = hard||0;
    if((r.game||"pkmn")!==GAME) return false;
    if(GAME==="pkmn" && (r.lang||"en")!==LANG) return false;
    if(!inEra(r)) return false;
    if(!passMode(r)) return false;
    if(lv<1 && tlc && !(r.t||[]).map(x=>x.toLowerCase()).includes(tlc)) return false;
    if(lv<1 && f.hp!=null){ const h=parseInt(r.hp)||0; if(!h || Math.abs(h-f.hp)>20) return false; }
    if(lv<2 && slc && !stampOK(slc, r)) return false;
    if(lv<2 && f.subtype && !stampOK(f.subtype.toLowerCase(), r)) return false;
    if(f.mech && !stampOK(f.mech, r)) return false;
    if(lv<1 && f.delta && !(r.n||"").includes("δ")) return false;
    if(f.eraMax!=null && r.y>f.eraMax) return false;
    if(f.eraMin!=null && r.y<f.eraMin) return false;
    if(f.setCode && (r.c||"").toLowerCase()!==f.setCode) return false;
    if(f.setName && (r.s||"")!==f.setName) return false;
    if(f.setIn && !f.setIn.has(r.s||"")) return false;
    if(f.jpCodes && !f.jpCodes.includes((r.c||"").toLowerCase())) return false;
    if(lv<1 && f.rarity){ const rr=r.r||""; const ok = f.rarity.anyOf ? f.rarity.anyOf.includes(rr) : (f.rarity.eq ? rr===f.rarity.eq : rr.includes(f.rarity.has));
      // "shining" is also printed in the name: promo reprints (Shining Lugia SM82) carry rarity "Promo"
      const named = f.rarity.has==="Shining" && /^shining\b/i.test(r.n||"");
      if(!ok && !named) return false; }
    if(f.jp){ const rr=r.r||""; const toks=rr.toUpperCase().split(/[^A-Z0-9]+/).filter(Boolean); if(!(toks.includes(f.jp.code) || rr.trim().toLowerCase()===f.jp.full.toLowerCase())) return false; }
    if(f.printing){ if(!Object.keys(r.px||{}).some(k=>k.toLowerCase().includes(f.printing))) return false; }
    if(f.number && !numMatch(r.num, f.number, !!f.setSize)) return false;
    if(lv<1 && f.setSize){ const z=SET_SIZE[r.s]; if(z && !z.includes(f.setSize)) return false; }   // unknown size: keep; relaxed retry drops it
    return true;
  };
  // set/number/printing identity, kept even in the loosest name-collision net so a fallback can't cross a set boundary
  const passId = r => (r.game||"pkmn")===GAME && (GAME!=="pkmn"||(r.lang||"en")===LANG) && inEra(r) && passMode(r)
    && (!f.setCode || (r.c||"").toLowerCase()===f.setCode) && (!f.setName || (r.s||"")===f.setName) && (!f.setIn || f.setIn.has(r.s||"")) && (!f.mech || stampOK(f.mech, r))
    && (!f.printing || Object.keys(r.px||{}).some(k=>k.toLowerCase().includes(f.printing)))
    && (!f.number || numMatch(r.num, f.number, !!f.setSize));

  let res, literal=false;
  if(q){
    res = ms.search(q,{combineWith:"AND"}).filter(r=>passFilters(r));
    if(!res.length) res = ms.search(q).filter(r=>passFilters(r));
    if(!res.length){ let relaxed = ms.search(q).filter(r=>passFilters(r,1)); if(!relaxed.length) relaxed = ms.search(q).filter(r=>passFilters(r,2)); if(relaxed.length){ res=relaxed; literal=true; } }   // over-narrow qualifier zeroed it: retry dropping loose descriptors, then subtype/stage, keeping set/number identity
    if(!res.length && qFull && qFull!==q){ res = ms.search(qFull).filter(passId); literal=true; }   // name/keyword collision safety net (still anchored to set/number)
    if(res.length < 4){   // sounds-like fallback for misspellings beyond fuzzy's reach
      const seen=new Set(res.map(r=>r.id)), names=new Set();
      for(const t of q.split(/\s+/)){ if(t.length<4) continue; const hit=PHON.get(phonKey(t)); if(hit) hit.forEach(n=>names.add(n)); }
      for(const nm of [...names].slice(0,6)){ ms.search(nm).filter(r=>passFilters(r)).forEach(r=>{ if(!seen.has(r.id)){ seen.add(r.id); res.push(r); } }); }
    }
    // exact name (typed in full or picked from a suggestion chip): only cards carrying that whole name.
    // "mew" -> Mew, Mew ex, Ancient Mew; never Mewtwo. "meowth" keeps Alolan / Team Rocket's Meowth.
    if(isBaseName(q)){ const qq=" "+q+" ", ex=res.filter(r=>(" "+normName(r.n)+" ").includes(qq)); if(ex.length) res=ex; }
  } else {
    res = CARDS.map(c=>({...c, score:1})).filter(r=>passFilters(r));
  }
  // relevance-first when the *typed query* has a discriminating signal; newest-first for a bare name.
  // FA toggle is a mode, not a query qualifier, so it must NOT flip the sort.
  const hasFilter = !!(f.setSize||f.mech||f.setCode||f.setName||f.setIn||f.jpCodes||f.type||f.hp!=null||f.stage||f.subtype||f.delta||f.eraMin!=null||f.eraMax!=null||f.rarity||f.number||f.jp||f.printing);
  // a 2+ word name query (e.g. "misty poliwhirl", "brock zubat") is itself discriminating: rank by
  // relevance so a precise multi-token match wins, not by year — otherwise the OR/phonetic fallback
  // padding buries a vintage exact hit (Gym Heroes owner cards) under newer loose matches.
  const multiWord = q.split(/\s+/).filter(Boolean).length >= 2;
  PRINT_HINT = f.printing || "";
  if(raw.trim()) seedCUR(raw, f, res.length);   // live search episode for the feedback log
  render(res, literal, !hasFilter && !multiWord);
}

function render(res, literal, newestFirst){
  const wrap = $("#results"); wrap.innerHTML = "";
  // bare name / empty -> newest wins, relevance breaks ties. Qualified query -> relevance wins, newest breaks ties.
  res = res.slice().sort(newestFirst
    ? (a,b)=>((b.y||0)-(a.y||0)) || ((b.o||0)-(a.o||0)) || ((b.score||0)-(a.score||0))
    : (a,b)=>((b.score||0)-(a.score||0)) || ((b.y||0)-(a.y||0)) || ((b.o||0)-(a.o||0)));
  $("#status").textContent = res.length ? (res.length + " match" + (res.length>1?"es":"") + (literal?"  · no exact filter match — closest by name":"")) : "no matches — try fewer words, or just the Pokémon name";
  res.slice(0,16).forEach(r=>{
    const el = document.createElement("div"); el.className = "card"; el.dataset.id = r.id;
    const best=bestMarket(r);
    const sp = best>0 ? speedOf(r, best, "NM") : null;
    const mb = best>0 ? bidForMargin(best, sp.margin) : null;
    const pb = best>0 ? bidForProfit(best, getNum("tgtprofit",0)) : null;
    const bidHTML = best>0 ? `<div class="bids">
        <div class="brow bm"><span class="blab">margin</span><b class="cpy exact" data-bid="${mb.toFixed(2)}" title="${cpTitle()}">$${mb.toFixed(2)}</b><b class="cpy rounded" data-bid="${Math.floor(mb)>=1?Math.floor(mb):mb.toFixed(2)}" title="whole dollars, rounded down · tap to copy">${Math.floor(mb)>=1?`$${Math.floor(mb)}`:`$${mb.toFixed(2)}`}</b><span class="bpc">${pctMkt(mb,best)}</span></div>${speedRow(sp,best)}
        <div class="brow bp"><span class="blab">${getNum("tgtprofit",0)===0?"b/e":"profit"}</span><b class="cpy" data-bid="${pb.toFixed(2)}" title="${cpTitle()}">$${pb.toFixed(2)}</b><span class="bpc">${pctMkt(pb,best)}</span></div>
      </div>` : "";
    el.innerHTML = `
      <div class="row">
        <img src="${r.img}" loading="lazy" alt="" onerror="this.classList.add('noimg')">
        <div class="meta">
          <div class="nm">${r.n}</div>
          <div class="tags">${r.sealed
            ? `<b>${r.s}</b><span class="xtra"> · 📦 ${r.kind||"sealed"}</span>`
            : `<b>${r.s}</b><span class="xtra"> ${r.c?("· "+r.c):""} ${r.num?("· #"+r.num):""} · ${r.r||"—"}</span>`}${trendTag(r)}${liveTag(r)}</div>
        </div>
        ${bidHTML}
        <div class="rails">
          <div class="rail rg" title="good search · this card">✓</div>
          <div class="rail ry" title="found it, but hard to find · this card">~</div>
        </div>
      </div>
      <div class="detail"></div>`;
    const row = el.querySelector(".row"), det = el.querySelector(".detail");
    // Opening a tile expanded it in place, so a card in the second row put the bid table below the
    // fold and every comp started with a scroll. Pull the opened card to the top of the viewport.
    // Anchoring on the card's top is height-independent, so it works before the detail has painted.
    row.onclick = () => { const qel=$("#q"); if(qel) qel.blur(); const open = el.classList.toggle("open"); if(open && CUR) CUR.openedId=r.id; if(open){ LAST_VIEW={id:r.id, at:Date.now(), el}; if(typeof paintLot==="function") paintLot(); } if(open && !det.dataset.loaded){ det.dataset.loaded="1"; loadPrices(r, det); } else if(open && PICK) addPickRow(det, r); if(open) requestAnimationFrame(()=>{ const sr=document.querySelector(".searchrow"); el.style.scrollMarginTop=((sr?sr.offsetHeight:0)+8)+"px"; el.scrollIntoView({behavior:"smooth",block:"start"}); }); };
    const im = el.querySelector("img");
    // in tile view the art IS the tap target, so let the click bubble to the row and open the card;
    // once open the tile is list-shaped again and the thumbnail goes back to zooming.
    if(im) im.onclick = (e)=>{ if(VIEW==="grid" && !el.classList.contains("open")) return; e.stopPropagation(); zoom((r.img||"").replace(/\.png$/,"_hires.png")); };
    el.querySelectorAll(".row .cpy").forEach(c=>c.onclick=(e)=>{ e.stopPropagation(); copyAmt(c.dataset.bid, c); });
    const rg=el.querySelector(".rail.rg"); if(rg) rg.onclick=(e)=>{ e.stopPropagation(); flagGood(r.id); };
    const ry=el.querySelector(".rail.ry"); if(ry) ry.onclick=(e)=>{ e.stopPropagation(); flagOk(r.id); };
    wrap.appendChild(el);
  });
}

/* ---------- type-ahead chips ---------- */
// Two steps. A name fragment ("zard", "chari") offers full names. Once a name is complete
// ("charizard "), the next fragment offers only suffixes that exist for that name in the catalog
// (V, VMAX, VSTAR, ex...). Chips are a shortcut only: results keep updating as you type.
// Catalog names carry finish words, collector numbers, years, winner names and promo codes
// ("Umbreon 10 90 Cracked Ice Holo", "Mew ex 2006 Jimmy Ballard", "Pikachu DP16"). Chips want the bare name.
function sugName(n){
  return (n||"")
    .replace(/\s+(Mirror Foil|Mirror Holo(foil)?|Master Ball Pattern|Pok[eé] Ball Pattern|Cracked Ice Holo|Cosmos Holo|Reverse Holo(foil)?|Non Holo|Holo|Winner|Staff|Prerelease|Stamped|Epic|Enchanted|Iconic)\b.*$/i,"")
    .replace(/\s+\d.*$/,"")
    .replace(/(\s+[A-Z]{1,5}\d+[a-z]?)+$/,"")
    .replace(/\s+and\s+/i," & ")
    .trim();
}
// mechanic suffix, with the old hyphen style too ("Charizard-EX", "Charizard & Braixen-GX")
const SUG_SUFFIX = /[\s-]+(ex|v|vmax|vstar|v-union|gx|break|lv\.?x|prime|legend|star|◇|★|δ)(\s.*)?$/i;
let SUG = null;
function sugIndex(){
  const key = GAME+"|"+LANG+"|"+CARDS.length;
  if(SUG && SUG.key===key) return SUG;
  const cnt=new Map(), disp=new Map(), byBase=new Map();
  for(const c of CARDS){
    if(c.sealed || (c.game||"pkmn")!==GAME) continue;
    if(GAME==="pkmn" && (c.lang||"en")!==LANG) continue;
    const n=sugName(c.n);
    if(!n) continue;
    const base = GAME==="pkmn" ? (n.replace(SUG_SUFFIX,"").trim() || n) : n;
    const lc=base.toLowerCase();
    cnt.set(lc,(cnt.get(lc)||0)+1); if(!disp.has(lc)) disp.set(lc,base);
    const rest=n.slice(base.length).replace(/^[\s-]+/,"").split(/\s+/)[0];   // "GX SM60" -> "GX", "Star Delta Species" -> "Star"
    if(rest){
      if(!byBase.has(lc)) byBase.set(lc,new Map());
      const m=byBase.get(lc), rk=rest.toLowerCase(), cur=m.get(rk);
      m.set(rk, cur ? {t:cur.t,k:cur.k+1} : {t:rest,k:1});
    }
  }
  const bases=[...cnt].map(([lc,k])=>({b:disp.get(lc),lc,k})).sort((a,b)=>b.k-a.k);
  return (SUG={key,cnt,bases,byBase});
}
const normName = s => (s||"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
let BASE_NORM=null, BASE_KEY="";
function isBaseName(q){   // q is a complete Pokemon/character name in the current game+lang
  const idx=sugIndex();
  if(BASE_KEY!==idx.key){ BASE_NORM=new Set([...idx.cnt.keys()].map(normName)); BASE_KEY=idx.key; }
  return BASE_NORM.has(normName(q));
}
function sugExpand(tok){
  for(const [re,v] of NICK){ if(re.source.replace(/\\b/g,"")===tok) return v; }
  if(tok.length>=3 && tok.length<=4 && ABBR.has(tok)) return ABBR.get(tok);
  return tok;
}
// pure: raw input -> {frag, items:[{label, k}]}. Exposed for the test harness.
function suggest(raw){
  const idx=sugIndex();
  const v=(raw||"").toLowerCase();
  if(!v.trim()) return {frag:"",items:[]};
  const toks=v.trim().split(/\s+/);
  const frag=/\s$/.test(v) ? "" : toks.pop();
  // step 2: the words before the fragment end in a complete name -> its real suffixes
  for(let i=0;i<toks.length;i++){
    const base=toks.slice(i).map(sugExpand).join(" ");
    const m=idx.byBase.get(base);
    if(!m) continue;
    const items=[...m.values()].filter(x=>x.t.toLowerCase().startsWith(frag)).sort((a,b)=>b.k-a.k).slice(0,8).map(x=>({label:x.t,k:x.k}));
    return {frag,items};   // name recognized: offer its suffixes or nothing, never an unrelated name
  }
  // step 1: name completion
  if(frag.length<2 || /^\d+$/.test(frag)) return {frag,items:[]};
  const seen=new Set(), out=[];
  const add=lc=>{ if(!lc || seen.has(lc) || !idx.cnt.has(lc)) return; seen.add(lc); out.push({label:idx.bases.find(b=>b.lc===lc).b,k:idx.cnt.get(lc)}); };
  for(const [re,val] of NICK){ if(re.source.replace(/\\b/g,"").startsWith(frag)) add(val); }
  if(frag.length>=3 && frag.length<=4 && ABBR.has(frag)) add(ABBR.get(frag));
  for(const b of idx.bases){ if(out.length>=6) break; if(b.lc.startsWith(frag)) add(b.lc); }
  // inner-word matches ("gren" -> Radiant Greninja) only on the first word; later on, the word is usually a set name
  if(!toks.length) for(const b of idx.bases){ if(out.length>=6) break; if(b.lc.split(/\s+/).some(w=>w.startsWith(frag))) add(b.lc); }
  const solid=out.filter(x=>x.k>1);   // hide one-off oddities ("Pikachu SM04 Target") when real choices exist
  return {frag,items:(solid.length>=3?solid:out).slice(0,6)};
}
// keyboard: Tab / Shift+Tab (or Down/Up) move a highlight right / left, Enter or Space takes it. With nothing
// highlighted, Enter searches what was typed and Space types a space. Esc hides. Tap works as before.
let SUG_SEL=-1, SUG_PICK=null, SUG_N=0;
function renderSug(){
  const box=$("#sug"), qel=$("#q");
  if(!box || !qel) return;
  const {frag,items}=suggest(qel.value);
  SUG_SEL=-1; SUG_N=0; SUG_PICK=null;
  if(!items.length || document.activeElement!==qel || box.dataset.hidden===qel.value){ box.classList.remove("on"); box.innerHTML=""; return; }
  box.innerHTML=items.map((x,i)=>`<button type="button" data-i="${i}">${escH(x.label)}<i>${x.k}</i></button>`).join("");
  box.classList.add("on");
  SUG_N=items.length;
  SUG_PICK=i=>{
    const lab=items[i].label, pick = lab==="★" ? "star" : lab;   // parse() reads "star" as the Gold Star subtype; the glyph is ignored
    const val=qel.value, cut=val.length-frag.length;
    qel.value=val.slice(0,cut).replace(/\s*$/, cut>0?" ":"")+pick+" ";
    qel.focus(); try{ qel.setSelectionRange(qel.value.length,qel.value.length); }catch(_){}
    $("#qclear").style.display="block";
    clearTimeout(t); run(qel.value); renderSug();
  };
  box.querySelectorAll("button").forEach(b=>{ b.onclick=()=>SUG_PICK(+b.dataset.i); });
}
function sugHighlight(i){
  const bs=[...$("#sug").querySelectorAll("button")]; if(!bs.length) return;
  SUG_SEL=(i+bs.length)%bs.length;
  bs.forEach((b,j)=>b.classList.toggle("sel", j===SUG_SEL));
  bs[SUG_SEL].scrollIntoView({block:"nearest",inline:"nearest"});
}
function sugKey(e){   // true if the key was used by the suggestion chips
  if(!SUG_N || !SUG_PICK || !$("#sug").classList.contains("on")) return false;
  if(e.key==="ArrowDown"){ e.preventDefault(); sugHighlight(SUG_SEL+1); return true; }
  if(e.key==="ArrowUp"){ e.preventDefault(); sugHighlight(SUG_SEL<0 ? -1 : SUG_SEL-1); return true; }
  if(e.key==="Tab"){ e.preventDefault(); sugHighlight(e.shiftKey ? (SUG_SEL<0 ? -1 : SUG_SEL-1) : SUG_SEL+1); return true; }   // Tab right, Shift+Tab left
  if((e.key==="Enter" || e.key===" ") && SUG_SEL>=0){ e.preventDefault(); SUG_PICK(SUG_SEL); return true; }   // only once a chip is highlighted
  if(e.key==="Escape"){ e.preventDefault(); const box=$("#sug"); box.dataset.hidden=$("#q").value; box.classList.remove("on"); box.innerHTML=""; SUG_N=0; return true; }
  return false;
}

/* ---------- wiring ---------- */
let t=null;
$("#q").addEventListener("input", e=>{ clearTimeout(t); $("#qclear").style.display = e.target.value?"block":"none"; if(!e.target.value.trim()) finalize("u"); t=setTimeout(()=>run(e.target.value), 110); });
$("#q").addEventListener("beforeinput", e=>{ const el=e.target, L=el.value.length; if(L>0 && el.selectionStart===0 && el.selectionEnd===L) finalize("u"); });   // type-over after focus select-all = new search, old one logs unflagged
$("#q").addEventListener("focus", e=>{ try{ e.target.select(); }catch(_){} });
$("#q").addEventListener("keydown", e=>{ if(sugKey(e)) return; if(e.key==="Enter"){ e.preventDefault(); clearTimeout(t); run(e.target.value); e.target.blur(); } });
$("#qclear").onclick = ()=>{ finalize("u"); armUndo(); clearSearch(); };
$("#q").addEventListener("input", renderSug);
$("#q").addEventListener("focus", renderSug);
$("#q").addEventListener("blur", ()=>setTimeout(renderSug,120));
$("#sug").addEventListener("pointerdown", e=>e.preventDefault());   // tapping a chip must not blur the input (keyboard stays up)
(function(){
  const s=$("#flagstrip");
  if(s){
    s.querySelector('[data-fl="g"]').onclick=()=>flagGood();
    s.querySelector('[data-fl="y"]').onclick=()=>flagOk();
    s.querySelector('[data-fl="r"]').onclick=()=>flagBad();
  }
  const ub=$("#undobar"); if(ub) ub.onclick=undoLast;
  const v=$("#slogview"); if(v) v.onclick=()=>{ const b=$("#slogbody"); const show=b.style.display==="none"; b.style.display=show?"block":"none"; if(show) renderSlog(); };
  const cp=$("#slogcopy"); if(cp) cp.onclick=()=>{ const str=JSON.stringify(SLOG); const flash=()=>{ const t0=cp.textContent; cp.textContent="copied ✓"; setTimeout(()=>{ cp.textContent=t0; },800); }; if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(str).then(flash,()=>copyFallback(str,flash)); else copyFallback(str,flash); };
  const dl=$("#slogdl"); if(dl) dl.onclick=()=>{ const b=new Blob([JSON.stringify(SLOG)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download="cardcomp-searchlog.json"; document.body.appendChild(a); a.click(); document.body.removeChild(a); setTimeout(()=>URL.revokeObjectURL(a.href),1000); };
  const cl=$("#slogclear"); if(cl) cl.onclick=()=>{ if(confirm("clear search log?")){ SLOG=[]; slogSave(); updateSlogUI(); } };
  window.addEventListener("pagehide", ()=>{ finalize("u"); });   // best effort; iOS killing a backgrounded tab from the app switcher never fires this, that one record is lost by design
  window.addEventListener("pageshow", ()=>{ const qel=$("#q"); if(!CUR && qel && qel.value.trim() && window.__ready) run(qel.value); });   // bfcache restore after pagehide finalized: re-seed the visible query
  paintStrip();
})();

/* settings: persist (safe if storage blocked), toggle, zoom close */
function saveCfg(){ try{ const o={}; document.querySelectorAll("#settings input").forEach(i=>o[i.id||("m_"+i.dataset.c)]=(i.type==="checkbox"?i.checked:i.value)); localStorage.setItem("cardcomp_cfg",JSON.stringify(o)); }catch(e){} }
function loadCfg(){ try{ const o=JSON.parse(localStorage.getItem("cardcomp_cfg")||"{}"); document.querySelectorAll("#settings input").forEach(i=>{ const k=i.id||("m_"+i.dataset.c); if(o[k]!=null){ if(i.type==="checkbox") i.checked=!!o[k]; else if(o[k]!=="") i.value=o[k]; } }); }catch(e){} }
function migrateCfg(){   // 2026-10: speed-based margin treats this setting as its floor and assumes 10%
  try{
    if(localStorage.getItem("cardcomp_m10")) return;
    const el=$("#cfg-tgtmargin");
    if(el && String(el.value).trim()==="15"){ el.value="10"; saveCfg(); }
    localStorage.setItem("cardcomp_m10","1");
  }catch(e){}
}
loadCfg(); migrateCfg();
applyFeedback();
document.querySelectorAll("#settings input").forEach(i=>i.addEventListener("change", ()=>{ saveCfg(); renderCart(); applyFeedback(); if(window.__ready && $("#q").value.trim()) run($("#q").value); }));
$("#gear").onclick = ()=>{ const open=$("#settings").classList.toggle("open"); if(open) updateSlogUI(); };
$("#zoom").onclick = ()=> $("#zoom").classList.remove("open");

$("#q").focus();
document.querySelectorAll("#langtoggle button").forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
{ const gs=$("#gamesel"); if(gs) gs.onchange=()=>setGame(gs.value); }
const MODE_SEL = {bulk:"#bulktoggle", val25:"#val25toggle", val50:"#val50toggle", fa:"#fatoggle", promo:"#promotoggle", sealed:"#sealedtoggle"};
const ERA_SEL  = {vintage:"#eravintage", mid:"#eramid", modern:"#eramodern"};
const paintPill=(el,on)=>{ if(!el)return; el.style.borderColor=on?"var(--gold)":"var(--line)"; el.style.color=on?"var(--ink)":"var(--dim)"; el.style.background=on?"rgba(245,179,1,.10)":"var(--panel2)"; };
function paintToggles(){ for(const m in MODE_SEL) paintPill($(MODE_SEL[m]), MODE===m); paintFilterSum(); }
function paintEra(){ for(const e in ERA_SEL) paintPill($(ERA_SEL[e]), ERA===e); paintFilterSum(); }
// The filter rows are ~2/5 of the header and never change mid-auction, so they collapse. Whatever is
// active is echoed on the bar, otherwise a filter could silently hide a card during a live comp.
const MODE_LABEL={bulk:"Hide bulk",val25:"$25+",val50:"$50+",fa:"Full Art",promo:"Promos",sealed:"Sealed"};
const ERA_LABEL={vintage:"Vintage",mid:"Mid-era",modern:"Modern"};
function paintFilterSum(){
  const on=[ERA?ERA_LABEL[ERA]:null, MODE?MODE_LABEL[MODE]:null].filter(Boolean);
  const s=$("#filtersum"); if(s) s.textContent=on.join(" · ");
  paintPill($("#filtertoggle"), on.length>0);
}
function setFilters(open){
  const w=$("#filterwrap"); if(w) w.style.display=open?"block":"none";
  try{ localStorage.setItem("cardcomp_filtersopen", open?"1":"0"); }catch(e){}
  const b=$("#filtertoggle"); if(b) b.textContent=open?"⚙ Hide":"⚙ Filters";
  paintFilterSum();
}
(function(){
  for(const m in MODE_SEL){ const el=$(MODE_SEL[m]); if(el) el.onclick=()=>{ MODE=(MODE===m)?"":m; paintToggles(); if(window.__ready) run($("#q").value); }; }
  for(const e in ERA_SEL){ const el=$(ERA_SEL[e]); if(el) el.onclick=()=>{ ERA=(ERA===e)?"":e; paintEra(); if(window.__ready) run($("#q").value); }; }
  const rb=$("#resetbtn"); if(rb) rb.onclick=()=>{ MODE=""; ERA=""; paintToggles(); paintEra(); if(window.__ready) run($("#q").value); };   // clear every result filter; leaves the typed query so a live comp isn't lost
  const vb=$("#viewtoggle"); if(vb) vb.onclick=()=>setView(VIEW==="grid"?"list":"grid");
  const cb=$("#coltoggle"); if(cb) cb.onclick=()=>setCols(COLS>=4?2:COLS+1);   // cycle 2 -> 3 -> 4
  setView(VIEW);
  const ft=$("#filtertoggle");
  let fopen=false; try{ fopen=localStorage.getItem("cardcomp_filtersopen")==="1"; }catch(e){}
  if(ft) ft.onclick=()=>setFilters($("#filterwrap").style.display==="none");
  setFilters(fopen);
})();
setLang((()=>{ try{ return localStorage.getItem("cardcomp_lang"); }catch(e){ return null; } })()||"en", true);
loadCart(); renderCart();
$("#cartclear").onclick = clearCart;
$("#cartsum").onclick = ()=>{ const it=$("#cartitems"); it.style.display = (it.style.display==="none"?"block":"none"); };
boot();
