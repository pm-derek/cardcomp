<!doctype html><html><head><meta charset="utf-8"><title>Recognition test</title>
<style>body{font:14px/1.5 system-ui,sans-serif;background:#0b0d10;color:#e8edf2;max-width:980px;margin:24px auto;padding:0 16px}
h2{margin:0 0 4px}.dim{color:#8b97a5;font-size:13px}button{background:rgba(245,179,1,.12);border:1px solid #f5b301;border-radius:7px;color:#e8edf2;font:inherit;padding:6px 12px;cursor:pointer;margin:10px 8px 0 0}
#sum{margin:14px 0;padding:10px 12px;border:1px solid #2a313a;border-radius:8px}.row{display:flex;gap:14px;padding:12px 0;border-top:1px solid #2a313a}
.row img{width:260px;border-radius:6px;background:#1b2026}.ok{color:#5fd6a0}.bad{color:#ff6b6b}code{color:#f5b301;font-size:12px}</style></head><body>
<h2>Recognition test</h2>
<div class="dim">Experiment, stored only in this extension. On a Whatnot stream press the shortcut (Alt+Shift+R unless changed at chrome://extensions/shortcuts): one frame is grabbed, then a second one 5 s later with no key press.</div>
<button id="exp">Export (JSON)</button><button id="wipe">Delete all</button>
<div id="sum"></div><div id="list"></div>
<script src="debug.js"></script></body></html>
